/* ============================================================================
   BUYSON / BISON DESIGN SYSTEM — VIOLET SIGNATURE EDITION
   RELEASE 04 · FILE 01 / STYLES.HTML
   ---------------------------------------------------------------------------
   Visual source: official BUYSON bison artwork supplied by the founder.
   Theme: bison strength, forward motion, deep amethyst, electric violet.
   This layer extends the RC3 component vocabulary without altering any IDs,
   forms, server calls, database schema, role authorization or event handlers.
   ============================================================================ */

/* 01. DESIGN TOKENS — extracted and art-directed from the official logo */
:root {
  /* The existing project uses these aliases in all 3 role workspaces. */
  --navy: #5120a1;
  --deep: #270747;
  --blue: #8530ed;
  --purple: #7121d1;
  --purple-mid: #963cf0;
  --ink: #26113c;
  --muted: #786987;
  --bg: #faf8ff;
  --white: #ffffff;
  --border: #e9def5;
  --green: #137956;
  --red: #b52f58;
  --amber: #8b5816;
  --shadow: 0 16px 42px rgba(56,18,98,.07);
  --radius: 18px;

  --bison-ink: #22053e;
  --bison-night: #2c0756;
  --bison-grape: #401077;
  --bison-royal: #5d19b3;
  --bison-purple: #7724d5;
  --bison-electric: #9638f4;
  --bison-orchid: #b568fb;
  --bison-lavender: #d9a7ff;
  --bison-frost: #f6efff;
  --bison-faint: #fcfaff;
  --bison-line: #e9ddf5;
  --bison-subtle: #8b7b9c;
  --bison-success: #136f52;
  --bison-warning: #8b5816;
  --bison-danger: #b12b56;
  --bison-gold: #ffe6a4;

  --brand-gradient: linear-gradient(126deg,#501094 0%,#7524d4 48%,#a14ff6 100%);
  --brand-gradient-dark: linear-gradient(120deg,#21023b 0%,#360865 38%,#5b16a7 77%,#782acc 100%);
  --brand-gradient-shine: linear-gradient(120deg,#5020ad,#8d35ef 61%,#c37fff);
  --page-gradient: linear-gradient(180deg,#ffffff 0%,#fcf9ff 33%,#f9f5ff 100%);
  --shadow-xs: 0 2px 9px rgba(37,12,80,.04);
  --shadow-sm: 0 8px 24px rgba(37,12,80,.07);
  --shadow-md: 0 16px 40px rgba(37,12,80,.10);
  --shadow-lg: 0 28px 80px rgba(32,5,69,.17);
  --easing-brand: cubic-bezier(.22,.9,.27,1);
  --focus-ring: 0 0 0 4px rgba(150,56,244,.19);
  --surface-radius: 22px;
}

/* 02. FOUNDATION & ACCESSIBILITY */
html {
  color-scheme: light;
  scroll-behavior: smooth;
  scrollbar-color: #c8abe9 #f7f1ff;
  text-rendering: optimizeLegibility;
}
body {
  min-width: 320px;
  margin: 0;
  overflow-x: clip;
  color: var(--bison-ink);
  background: var(--page-gradient);
  font-family: Inter, "Avenir Next", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#root { min-height: 54vh; isolation: isolate; }
*,*::before,*::after { box-sizing: border-box; }
::selection { background: #e0c5fc; color: #35105c; }
:focus-visible { outline: 3px solid #ae72f2 !important; outline-offset: 3px; }
:where(button,a,[role="button"],input,select,textarea):focus-visible { box-shadow: var(--focus-ring); }
:where(img,svg,video) { max-width: 100%; }
:where(button) { -webkit-tap-highlight-color: transparent; }
:where(button):disabled { cursor: not-allowed; opacity: .55; transform: none !important; }
:where(h1,h2,h3,h4,h5,h6) { text-wrap: balance; }
:where(p,li,td,th) { overflow-wrap: anywhere; }
:where(a) { text-underline-offset: 3px; }
:where(a:hover) { color: var(--bison-purple); }
.container { max-width: 1270px; }
.muted, .mini, .help, .sub { color: var(--bison-subtle); }
.eyebrow,.section-label,.kicker { color: var(--bison-purple); letter-spacing: .12em; }

/* 03. BRAND MASTHEAD */
.announcement-bar {
  min-height: 33px;
  padding: 8px 20px;
  background: linear-gradient(90deg,#250541,#371065 45%,#6021ae 100%);
  border-bottom: 1px solid rgba(255,255,255,.10);
  color: #ead8ff;
  letter-spacing: .18em;
  font-size: 10px;
  font-weight: 800;
}
.announcement-mark { color: #d7a5ff; text-shadow: 0 0 16px #af68fc; }
.announcement-divider { color: #b381e0; opacity: .8; }
.topbar {
  position: relative;
  z-index: 25;
  background: rgba(255,255,255,.97);
  border-bottom: 1px solid #ede1f7;
  box-shadow: 0 10px 35px rgba(44,9,88,.045);
  -webkit-backdrop-filter: blur(15px);
  backdrop-filter: blur(15px);
}
.topbar-inner { max-width: 1450px; min-height: 88px; }
.brand { gap: 11px; text-decoration: none !important; }
.brand-symbol {
  display: grid;
  place-items: center;
  background: transparent;
  border-radius: 13px;
  box-shadow: none;
  flex: none;
}
.brand-symbol img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 8px 7px rgba(80,17,142,.11)); }
.brand-wordmark strong {
  color: var(--bison-night);
  font-weight: 950;
  font-size: 26px;
  letter-spacing: -.072em;
  line-height: .96;
}
.brand-wordmark small { color: #8c6ca7; font-weight: 900; font-size: 8px; letter-spacing: .14em; margin-top: 8px; }
.topbar nav { gap: 5px; }
.topbar nav button {
  background: transparent;
  color: #59456f;
  font-weight: 750;
  border-radius: 12px;
  transition: background .2s ease,color .2s ease,transform .2s ease;
}
.topbar nav button:is(:hover,.active) { background: #f0e6fc; color: var(--bison-grape); }
.topbar nav button:hover { transform: translateY(-1px); }
.account-chip {
  background: #f7f0ff;
  border: 1px solid #e6d5f8;
  color: #472176;
  transition: box-shadow .2s ease,border-color .2s ease;
}
.account-chip:hover { border-color: #bd91ec; box-shadow: 0 5px 15px #6f2cad18; }
.account-avatar { background: var(--brand-gradient); color: white; }
.topbar-cta { background: var(--brand-gradient) !important; box-shadow: 0 8px 20px #6b1ab12f !important; }
.topbar-cta:hover { filter: brightness(1.06); }

/* 04. UNIFIED ACTIONS */
.btn {
  border-radius: 12px;
  font-weight: 800;
  letter-spacing: -.007em;
  min-height: 42px;
  background: var(--brand-gradient);
  color: #fff;
  border: 1px solid transparent;
  box-shadow: 0 7px 19px rgba(94,24,177,.16);
