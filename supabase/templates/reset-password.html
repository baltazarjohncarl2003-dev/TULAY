<h2>Reset your TULAY password</h2>
<p>Click the button below to choose a new password.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:10px 18px;background:#e30613;color:#fff;text-decoration:none;border-radius:6px;font-weight:bold">Set a new password</a></p>
<p>If you did not ask to reset your password, you can ignore this email. Your password stays the same.</p>
